<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>האי של המוזרים</title>
<style>
:root{--bg:#120a24;--ink:#f6ecff;--dim:#b9a6d6;--card:#24143f;--acc:#ff5fa8;--acc2:#7cf7d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120a24}}
:root[data-theme="dark"]{--bg:#120a24}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik","Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{padding:10px 14px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;margin:0;letter-spacing:.3px}
h1 span{color:var(--acc)}
#stat{font-size:12px;background:var(--card);padding:5px 10px;border-radius:99px;color:var(--acc2);white-space:nowrap}
#stage{position:relative;flex:1;min-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
#tip{position:absolute;inset:auto 12px 10px 12px;background:var(--card);border:1px solid #4b2d7a;border-radius:16px;padding:12px 14px;display:none;font-size:14px;line-height:1.5}
#tip b{color:var(--acc)}
#tip .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
button{font:inherit;border:0;border-radius:12px;padding:9px 14px;background:var(--acc);color:#2a0620;font-weight:700;cursor:pointer}
button.alt{background:#3a2362;color:var(--ink)}
#bar{padding:8px 12px 12px;display:flex;gap:8px}
#bar input{flex:1;min-width:0;border:1px solid #4b2d7a;background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;direction:ltr;text-align:left}
#note{font-size:11px;color:var(--dim);padding:0 14px 8px;line-height:1.4}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--acc2);color:#06241c;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#ov{position:fixed;inset:0;z-index:5;background:rgba(10,4,24,.95);display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:360px;text-align:center;background:var(--card);border:1px solid #4b2d7a;border-radius:22px;padding:24px 18px}
.box h2{margin:0 0 8px;font-size:22px}.box p{margin:0 0 12px;color:var(--dim);line-height:1.5;font-size:14px}
.box input{width:100%;border:1px solid #4b2d7a;background:#120a24;color:var(--ink);border-radius:12px;padding:12px;font:inherit;direction:ltr;text-align:left;margin-bottom:12px}
.box button{width:100%}
#oc{font-size:30px;font-weight:800;letter-spacing:3px;color:var(--acc2);margin:6px 0 16px;direction:ltr}
#toast{z-index:9}
#zb{position:absolute;top:44px;left:10px;display:flex;flex-direction:column;gap:8px;z-index:3}
#zb button{padding:8px 11px;font-size:18px;background:#3a2362;color:var(--ink)}
</style>
</head>
<body>
<div id="app">
<header><h1>האי של <span>המוזרים</span></h1><div id="stat">0 מוזרים · יום 1</div></header>
<div id="stage"><canvas id="c"></canvas><div id="zb"><button id="zh" aria-label="הבית שלי">🏠</button><button id="zw" aria-label="כל המפה">🌍</button></div><div id="toast"></div>
<div id="tip"></div></div>
<div id="ov"><div class="box"><h2 id="ot">ברוך הבא לאי המוזרים</h2><p id="op">כתוב את הכינוי שלך באינסטגרם ונבנה לך בית</p><div id="oc"></div><input id="h" placeholder="@instagram_handle" autocapitalize="off" autocomplete="off" spellcheck="false"><button id="add">המשך</button></div></div>
<div id="note">האימות נעשה דרך הודעה פרטית לבוט באינסטגרם.</div>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const TRAITS=["מדבר רק עם שרשראות","אוסף צללים של אחרים","בטוח שהוא ענן","ישן בעמידה על הראש","מנהל מכון יופי לאבנים","חושב שיום שלישי הוא בן אדם","מפחד מהשתקפות של עצמו","מגדל מילים בעציץ","מתכתב עם הירח, הירח לא עונה","אוכל רק דברים עגולים","מחליף שם בכל פעם שמישהו מצמץ","שומר סוד על הים"];
const EVENTS=["ירד גשם של דגים","עלה ירח שני","האי התחיל לזמזם","הים החליף צבע","הצללים ברחו לרגע","צמח עץ של כפכפים"];
const EMO=["🐟","🦷","👁️","🧦","🍄"];
let seedHandles=["weird_dana","noodle.king","moon_tooth","ofir_the_cloud","shadow.collector"];
let list=[];try{list=JSON.parse(localStorage.getItem('wi')||'[]')}catch(e){}
list=[];
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let myH=null,W,H,DPR,mons=[],sel=null,hueShift=0,moons=1,parts=[],day=1,t0=performance.now();
function build(){mons=list.map((h,i)=>{const r=rng(hash(h));
 const ang=i*2.399+r()*.4,rad=Math.sqrt(i+.7)*120;
 return{h,type:Math.floor(r()*5),hue:Math.floor(r()*360),eyes:1+Math.floor(r()*5),size:.8+r()*.6,
 trait:TRAITS[Math.floor(r()*TRAITS.length)],score:Math.floor(60+r()*40),ang,rad,ph:r()*6.28,likes:Math.floor(r()*900)}});
 document.getElementById('stat').textContent=mons.length+' מוזרים · יום '+day;mons.forEach(m=>{if(m.h===myH){m.me=true}})}
function resize(){DPR=Math.min(devicePixelRatio||1,2);const b=cv.getBoundingClientRect();W=b.width;H=b.height;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);
function pos(m,t){return{x:Math.cos(m.ang)*m.rad,y:Math.sin(m.ang)*m.rad*.62+Math.sin(t/700+m.ph)*3}}
const DEC=(()=>{const r=rng(99),a=[];for(let i=0;i<260;i++){const an=r()*6.283,d=Math.sqrt(r()),px=Math.cos(an)*d*1650,py=Math.sin(an)*d*900;if(Math.hypot(px,py*1.6)<380)continue;a.push({x:px,y:py,k:Math.floor(r()*4),h:Math.floor(r()*360),s:14+r()*26,p:r()*6.28})}return a})();
function deco(t){for(const d of DEC){const s=d.s;x.fillStyle='hsl('+((d.h+hueShift)%360)+',60%,60%)';
 if(d.k==0){x.fillRect(d.x-s*.12,d.y-s*.6,s*.24,s*.6);x.beginPath();x.arc(d.x,d.y-s*.6,s*.5,3.14,6.28);x.fill()}
 else if(d.k==1){x.strokeStyle='#4be39b';x.lineWidth=2;x.beginPath();x.moveTo(d.x,d.y);x.lineTo(d.x,d.y-s);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(d.x,d.y-s,s*.32,0,6.3);x.fill();x.fillStyle='#160a2a';x.beginPath();x.arc(d.x+Math.sin(t/600+d.p)*s*.1,d.y-s,s*.14,0,6.3);x.fill()}
 else if(d.k==2){x.beginPath();x.moveTo(d.x,d.y-s*1.4);x.lineTo(d.x+s*.3,d.y);x.lineTo(d.x-s*.3,d.y);x.fill()}
 else{x.beginPath();x.ellipse(d.x,d.y,s*.6,s*.32,0,0,6.3);x.fillStyle='rgba(30,10,50,.5)';x.fill()}}}
function island(t){const R=1900,cx=0,cy=6;ctx_blob(cx,cy+22,R*1.12,R*.66,'#0b0620',t,.5);
 ctx_blob(cx,cy,R*1.1,R*.64,'hsl('+(285+hueShift)+',45%,32%)',t,1);
 ctx_blob(cx,cy-8,R*.98,R*.55,'hsl('+(160+hueShift)+',50%,40%)',t,1.4);deco(t)}
function ctx_blob(cx,cy,rx,ry,col,t,k){ctx=x;ctx.beginPath();for(let a=0;a<=6.3;a+=.1){const w=1+.06*Math.sin(a*5+t/900*k)+.04*Math.sin(a*3-t/600);
 const px=cx+Math.cos(a)*rx*w,py=cy+Math.sin(a)*ry*w;a?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fillStyle=col;ctx.fill()}
function eye(x,y,r,t){ctx=x_;}
const x_=x;
function drawEye(px,py,r,t,ph){x.fillStyle='#fff';ctx_c(px,py,r);ctx_f();const dx=Math.sin(t/500+ph)*r*.3,dy=Math.cos(t/430+ph)*r*.3;x.fillStyle='#160a2a';ctx_c(px+dx,py+dy,r*.5);ctx_f()}
function ctx_c(a,b,r){x.beginPath();x.arc(a,b,r,0,6.3)}function ctx_f(){x.fill()}
function drawMon(m,t){const p=pos(m,t),s=m.size*Math.min(W,H)*.06,c='hsl('+((m.hue+hueShift)%360)+',75%,62%)';
 m.p=p;m.s=s;ctx_shadow(p,s);ctx_=x_;ex(m,p,s,c,t);
 if(m.me){const k=Math.max(1,.7/cam.z),ly=p.y-s*3.2-8*k,tx='@'+m.h;x_.font='bold '+Math.round(16*k)+'px system-ui,sans-serif';x_.textAlign='center';const w=x_.measureText(tx).width+22*k;x_.fillStyle='rgba(20,8,40,.88)';x_.fillRect(p.x-w/2,ly-20*k,w,28*k);x_.fillStyle='#ffd24a';x_.fillText(tx,p.x,ly);x_.textAlign='start'}}
let ctx_=x_;
function ctx_shadow(p,s){x.fillStyle='rgba(0,0,0,.25)';x.beginPath();ctx_e(p.x,p.y+s*.9,s*.9,s*.28)}
function ctx_e(a,b,rx,ry){ctx_ell(a,b,rx,ry);ctx_f()}
function ctx_ell(a,b,rx,ry){ex_e(a,b,rx,ry)}
function ex_e(a,b,rx,ry){x_.ellipse(a,b,rx,ry,0,0,6.3)}
function ex(m,p,s,c,t){ex_.call(null,m,p,s,c,t)}
function ex_(m,p,s,c,t){x_.fillStyle=c;const x=p.x,y=p.y;
 if(m.type==0){ctx_c(x,y,s);ctx_f()}
 else if(m.type==1){x_.strokeStyle=c;x_.lineWidth=s*.45;x_.lineCap='round';x_.beginPath();for(let i=0;i<=8;i++){const yy=y+s*.9-i*s*.38,xx=x+Math.sin(i*1+t/300+m.ph)*s*.3;i?x_.lineTo(xx,yy):x_.moveTo(xx,yy)}x_.stroke();ctx_c(x+Math.sin(8+t/300+m.ph)*s*.3,y-s*2.1,s*.7);ctx_f();p={x:x+Math.sin(8+t/300+m.ph)*s*.3,y:y-s*2.1};s*=.7}
 else if(m.type==2){x_.beginPath();x_.roundRect(x-s*.8,y-s,s*1.6,s*1.7,[s*.8,s*.8,s*.3,s*.3]);x_.fill();x_.fillRect(x-s*.55,y+s*.6,s*.3,s*.4);x_.fillRect(x+s*.25,y+s*.6,s*.3,s*.4)}
 else if(m.type==3){x_.beginPath();x_.moveTo(x,y-s*1.3);x_.lineTo(x+s*1.1,y+s*.8);x_.lineTo(x-s*1.1,y+s*.8);x_.closePath();x_.fill()}
 else{x_.beginPath();x_.arc(x,y,s,3.14,6.28);x_.fill();x_.strokeStyle=c;x_.lineWidth=s*.14;x_.lineCap='round';for(let i=0;i<5;i++){const bx=x-s+i*s*.5;x_.beginPath();x_.moveTo(bx,y);x_.quadraticCurveTo(bx+Math.sin(t/250+i)*s*.3,y+s*.6,bx,y+s*1.1+Math.sin(t/300+i+m.ph)*s*.2);x_.stroke()}}
 const n=m.eyes,er=Math.max(2.5,s*(n>3?.2:n>1?.28:.45));
 for(let i=0;i<n;i++){const ex=p.x+(i-(n-1)/2)*er*2.1,ey=p.y-(m.type==3?s*.1:0)+((i%2)?er*1.2:0)-er*.3;drawEye(ex,ey,er,t,m.ph+i)}
 if(m===sel){x_.strokeStyle='#fff';x_.setLineDash([4,4]);x_.lineWidth=2;x_.beginPath();x_.arc(p.x,p.y,s*1.7,0,6.3);x_.stroke();x_.setLineDash([])}}
function sky(t){const g=ctx_.createLinearGradient(0,0,0,H);g.addColorStop(0,'hsl('+(265+hueShift)+',60%,10%)');g.addColorStop(1,'hsl('+(280+hueShift)+',50%,18%)');ctx_.fillStyle=g;ctx_.fillRect(0,0,W,H);
 for(let i=0;i<40;i++){const r=rng(i*77);ctx_.fillStyle='rgba(255,255,255,'+(.3+.5*Math.abs(Math.sin(t/900+i)))+')';ctx_.fillRect(r()*W,r()*H*.45,1.6,1.6)}
 for(let k=0;k<moons;k++){const mx=W*(.2+k*.55),my=H*.12+k*14;ctx_.fillStyle=k?'#ffb3d9':'#fff6c8';ctx_c(mx,my,18);ctx_f();ctx_.fillStyle='rgba(0,0,0,.12)';ctx_c(mx+5,my-4,6);ctx_f()}}
function frame(){const t=performance.now()-t0;if(!W)resize();sky(t);camStep();x.save();x.translate(W/2+cam.x,H*.5+cam.y);x.scale(cam.z,cam.z);island(t);
 const arr=mons.slice().sort((a,b)=>pos(a,t).y-pos(b,t).y);arr.forEach(m=>drawMon(m,t));x.restore();
 parts=parts.filter(p=>p.y<H+30);parts.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30)*.5;ctx_.font='20px serif';ctx_.fillText(p.e,p.x,p.y)});
 requestAnimationFrame(frame)}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)}
function boom(){const k=Math.floor(Math.random()*EVENTS.length);toast(EVENTS[k]);
 if(k==0)for(let i=0;i<30;i++)parts.push({x:Math.random()*W,y:-Math.random()*200,v:2+Math.random()*3,e:'🐟'});
 else if(k==1)moons=Math.min(2,moons+1);else if(k==3||k==4)hueShift=(hueShift+70)%360;
 else if(k==5)for(let i=0;i<14;i++)parts.push({x:Math.random()*W,y:-Math.random()*200,v:2+Math.random()*2,e:'🩴'});
 else for(let i=0;i<14;i++)parts.push({x:Math.random()*W,y:-Math.random()*200,v:2+Math.random()*2,e:EMO[i%5]})}
const tip=document.getElementById('tip');
cv.addEventListener('click',e=>{if(moved){moved=false;return}const b=cv.getBoundingClientRect(),px=(e.clientX-b.left-W/2-cam.x)/cam.z,py=(e.clientY-b.top-H*.5-cam.y)/cam.z;
 let best=null,bd=1e9;mons.forEach(m=>{if(!m.p)return;const d=Math.hypot(m.p.x-px,m.p.y-py);if(d<Math.max(m.s*2,24/cam.z)&&d<bd){bd=d;best=m}});
 sel=best;if(!best){tip.style.display='none';return}
 tip.style.display='block';tip.innerHTML='<b>@'+best.h.replace(/</g,'')+'</b><br>'+best.trait+'<br>רמת מוזרות: '+best.score+'%'+
 '<div class="row"><span>❤ '+best.likes+'</span><button id="lk">תן לייק ותפעיל בונוס</button></div>';
 document.getElementById('lk').onclick=()=>{best.likes++;day++;boom();document.getElementById('stat').textContent=mons.length+' מוזרים · יום '+day;document.getElementById('lk').previousElementSibling.textContent='❤ '+best.likes}});
function finishJoin(){const i=document.getElementById('h'),v=i.value.trim().replace(/^@/,'').replace(/[^\w.]/g,'').slice(0,30);
 if(!v){toast('כתוב כינוי אינסטגרם');return}
 if(list.includes(v)){toast('כבר יש כזה באי');return}
 list.push(v);try{localStorage.setItem('wi',JSON.stringify(list))}catch(e){}
 myH=v;try{localStorage.setItem('wi_me',v)}catch(e){}build();sel=null;toast('@'+v+' נחת על האי');const me=mons.find(m=>m.me);if(me){const q=pos(me,0);cam.z=2.4;cam.x=-q.x*2.4;cam.y=-q.y*2.4;flyTo(.6,0,0,3800)}}
const ov=document.getElementById('ov'),ot=document.getElementById('ot'),op=document.getElementById('op'),oc=document.getElementById('oc'),hi=document.getElementById('h'),ab=document.getElementById('add');
let saved='';try{saved=localStorage.getItem('wi_me')||''}catch(e){}
if(saved){if(!list.includes(saved))list.push(saved);myH=saved;ov.style.display='none'}
let step=0;
ab.onclick=async()=>{
 if(step==0){const v=hi.value.trim().replace(/^@/,'').replace(/[^\w.]/g,'').slice(0,30);
  if(!v){toast('כתוב כינוי אינסטגרם');return}
  let r;try{r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({handle:v})})}catch(e){toast('אין חיבור לשרת');return}
  if(!r.ok){toast('הכינוי הזה כבר על האי');return}
  const {code}=await r.json();
  hi.value=v;hi.style.display='none';oc.textContent=code;
  ot.textContent='אימות דרך אינסטגרם';op.textContent='שלח את הקוד הזה בהודעה פרטית ל־@strangeisland2026';
  ab.style.display='none';step=1;
  const iv=setInterval(async()=>{try{
   const s=await (await fetch('/api/status?code='+code)).json();
   if(s.expired){clearInterval(iv);location.reload()}
   if(s.verified){clearInterval(iv);oc.textContent='';ot.textContent='🤖 הבוט ענה';op.textContent='קיבלתי, @'+v+'! בונה לך בית.';
    setTimeout(()=>{ov.style.display='none';finishJoin()},1800)}
  }catch(e){}},2000)}};
let cam={x:0,y:0,z:.6,anim:null},moved=false,mv=0,pd=0;const ptr=new Map();
const fitZ=()=>Math.min(W/4300,H/2700);
function clampCam(){cam.z=Math.max(fitZ(),Math.min(3,cam.z));const mx=2000*cam.z,my=1300*cam.z;cam.x=Math.max(-mx,Math.min(mx,cam.x));cam.y=Math.max(-my,Math.min(my,cam.y))}
function flyTo(z,wx,wy,d){cam.anim={t:performance.now(),d:d||1200,z0:cam.z,z1:z,x0:cam.x,x1:-wx*z,y0:cam.y,y1:-wy*z}}
function camStep(){const a=cam.anim;if(a){const p=Math.min(1,(performance.now()-a.t)/a.d),e=1-Math.pow(1-p,3);cam.z=a.z0+(a.z1-a.z0)*e;cam.x=a.x0*(1-e)+a.x1*e;cam.y=a.y0*(1-e)+a.y1*e;if(p>=1)cam.anim=null}else clampCam()}
cv.addEventListener('pointerdown',e=>{if(!ptr.size){moved=false;mv=0}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});cam.anim=null;pd=0});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptr.size==1){cam.x+=dx;cam.y+=dy;mv+=Math.abs(dx)+Math.abs(dy);if(mv>8)moved=true}
 else if(ptr.size==2){const [a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pd>0){const f=d/pd;cam.z*=f;cam.x*=f;cam.y*=f}pd=d;moved=true}});
const up=e=>{ptr.delete(e.pointerId);pd=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.15:.87;cam.z*=f;cam.x*=f;cam.y*=f},{passive:false});
document.getElementById('zw').onclick=()=>flyTo(fitZ(),0,0,1400);
document.getElementById('zh').onclick=()=>{const me=mons.find(m=>m.me)||mons[0];if(!me)return;const q=pos(me,0);flyTo(1.4,q.x,q.y,1200)};
fetch('/api/residents').then(r=>r.json()).then(a=>{a.forEach(q=>{if(!list.includes(q.handle))list.push(q.handle)})}).catch(()=>{}).finally(()=>{build();requestAnimationFrame(()=>{resize();frame()})});
</script>
</body>
</html>
